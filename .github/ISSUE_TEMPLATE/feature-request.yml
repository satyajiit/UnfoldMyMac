name: Feature request
description: Suggest an effect, wallpaper, or change to the app.
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or change?
      description: Describe how you would use it. Sketches and visual references help for effects and wallpapers.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Current workaround or related behaviour
      description: If the app already does something similar, describe what is missing.
