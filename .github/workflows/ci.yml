name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app and test core
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MacDuo
    env:
      UNFOLDMYMAC_SIGN_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build all test targets
        run: swift build --build-tests
      # Tests that need a Metal device or a window server carry `.requiresGPU` / `.requiresWindowServer`
      # and skip themselves when CI=true; everything else runs here.
      - name: Run tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log
      - name: Show tests skipped on this runner
        run: grep -E 'skipped' test.log || echo "no tests were skipped"
      - name: Build app bundle
        run: ./script/build_and_run.sh --build
      - name: Verify signature and bundled notices
        run: |
          codesign --verify --strict dist/UnfoldMyMac.app
          cmp ../LICENSE dist/UnfoldMyMac.app/Contents/Resources/LICENSE
          cmp ../NOTICE dist/UnfoldMyMac.app/Contents/Resources/NOTICE
          test -f dist/UnfoldMyMac.app/Contents/Resources/UnfoldMyMac_UnfoldMyMacKit.bundle/Resources/Fonts/OFL.txt
          test -z "$(find dist/UnfoldMyMac.app -type f -name '*.md' -print -quit)"
